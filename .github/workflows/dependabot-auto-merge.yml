name: Dependabot auto-merge

on:
  # Run only after the test pipeline completes so a repository without required
  # branch-protection checks cannot merge a failing Dependabot update.
  workflow_run:
    workflows:
      - checks
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # Only successful pull-request runs created by Dependabot are eligible.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0] != null

    steps:
      - name: Enable auto-merge for Dependabot PR
        env:
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          # Use a PAT, NOT the default GITHUB_TOKEN: GitHub does not start new
          # workflow runs from pushes made with GITHUB_TOKEN, so an auto-merge
          # enabled with it would never trigger the Release workflow on `main`.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Wait for every other PR pipeline (for example CodeQL) and stop as
          # soon as one fails. This is an explicit safety gate even when the
          # repository's branch-protection settings do not require checks.
          gh pr checks --watch --fail-fast "$PR_NUMBER"

          # Approve the PR (some branch protection rules require an approval)
          gh pr review --approve "$PR_NUMBER"

          # Enable GitHub's auto-merge; it will merge once all required checks (e.g. `checks` workflow) pass
          gh pr merge --auto --squash "$PR_NUMBER"
